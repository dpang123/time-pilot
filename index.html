<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Time Pilot — a faithful arcade-style multidirectional shooter across five time eras." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Time Pilot</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
        color: #fff;
        font-family: 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      body.modern-graphics canvas {
        image-rendering: auto;
        image-rendering: smooth;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Register service worker for offline play (production only).
      // Auto-update strategy:
      //  - Check for new SW on load and every 60s while the tab is open.
      //  - When a new SW takes control (controllerchange), reload the page once
      //    so mobile users get the new build without manually clearing data.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Tell any waiting SW to activate immediately.
            const activateWaiting = () => {
              if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            };
            activateWaiting();
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version installed alongside an old controller -> activate it.
                  activateWaiting();
                }
              });
            });
            // Poll for updates while the tab is open (helps installed PWAs).
            setInterval(() => reg.update().catch(() => {}), 60000);
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
